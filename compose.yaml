name: circuitdoctor

services:
  falkordb:
    image: falkordb/falkordb:6.0.2
    ports:
      - "127.0.0.1:6379:6379"
      - "127.0.0.1:3000:3000"
    environment:
      REDIS_ARGS: "--dir /data --appendonly yes --appendfsync everysec"
    volumes:
      - falkordb_data:/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 20s

volumes:
  falkordb_data:
